<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Для тебя ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
    color: white;
}

.screen {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.hidden {
    display: none !important;
}

.subtitle {
    font-size: 27px;
    margin-bottom: 35px;
    text-shadow: 0 2px 10px #8b2450;
}

button {
    border: none;
    padding: 18px 35px;
    border-radius: 50px;
    background: white;
    color: #ff4f7b;
    font-size: 21px;
    font-weight: bold;
    font-family: inherit;
    box-shadow: 0 8px 30px #7c214d66;
}

button:active {
    transform: scale(0.95);
}

.gallery {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 700px;
    margin-bottom: 20px;
}

.gallery img {
    width: 45%;
    max-width: 300px;
    height: 330px;
    object-fit: cover;
    border-radius: 22px;
    border: 3px solid white;
    box-shadow: 0 10px 35px #681c4466;
    animation: photo 1.5s ease;
}

h1 {
    font-size: clamp(42px, 10vw, 75px);
    margin: 10px 0;
    text-shadow:
        0 0 12px white,
        0 0 30px #ff1744;
    animation: appear 1.5s ease;
}

.note {
    font-size: 19px;
    margin-top: 5px;
}

@keyframes photo {
    from {
        opacity: 0;
        transform: scale(0.7);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.4);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.heart {
    position: fixed;
    bottom: -60px;
    pointer-events: none;
    animation: fly linear forwards;
    z-index: 5;
}

@keyframes fly {
    0% {
        transform: translateY(0) rotate(0);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform: translateY(-115vh) rotate(360deg);
        opacity: 0;
    }
}

@media (max-width: 600px) {

    .gallery img {
        width: 45%;
        height: 260px;
    }

    .subtitle {
        font-size: 23px;
    }

    .note {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<!-- ПЕРВЫЙ ЭКРАН -->

<div class="screen" id="start">

    <div class="subtitle">
        У меня для тебя кое-что есть... ❤️
    </div>

    <button onclick="showLove()">
        Нажми ❤️
    </button>

</div>


<!-- ВТОРОЙ ЭКРАН -->

<div class="screen hidden" id="love">

    <div class="gallery">

        <img src="./photo1.jpeg" alt="Наша фотография">

        <img src="./photo2.jpeg" alt="Наша фотография">

    </div>

    <h1>
        Я тебя люблю ❤️
    </h1>

    <div class="note">
        Ты — самое прекрасное, что есть в моей жизни 💕
    </div>

</div>


<!-- МУЗЫКА -->

<audio id="music" loop>
    <source src="./music.mp3" type="audio/mpeg">
</audio>


<script>

function showLove() {

    document
        .getElementById("start")
        .classList
        .add("hidden");

    document
        .getElementById("love")
        .classList
        .remove("hidden");

    // Запуск музыки
    const music = document.getElementById("music");

    music.play().catch(() => {});

    // Сердечки
    for (let i = 0; i < 40; i++) {

        setTimeout(createHeart, i * 100);

    }
}


function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    const hearts = [
        "❤️",
        "💗",
        "💕",
        "💖",
        "💓",
        "💞"
    ];

    heart.textContent =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (20 + Math.random() * 35) + "px";

    heart.style.animationDuration =
        (4 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 10000);
}


// Новые сердечки
setInterval(() => {

    const love =
        document.getElementById("love");

    if (!love.classList.contains("hidden")) {
        createHeart();
    }

}, 400);

</script>

</body>
</html>
