<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
            font-family: Georgia, "Times New Roman", serif;
            color: white;
        }

        .screen {
            position: relative;
            z-index: 10;
            width: 100%;
            text-align: center;
            padding: 20px;
            animation: fadeIn 1.5s ease;
        }

        .screen.hidden {
            display: none;
        }

        h1 {
            margin: 0 0 25px;
            font-size: clamp(40px, 9vw, 75px);
            text-shadow: 0 0 12px rgba(255,255,255,.9),
                         0 0 30px rgba(255,40,100,.9);
        }

        .subtitle {
            font-size: clamp(20px, 5vw, 30px);
            margin-bottom: 35px;
            text-shadow: 0 2px 10px rgba(0,0,0,.15);
        }

        button {
            border: none;
            padding: 17px 35px;
            border-radius: 50px;
            background: white;
            color: #ff4f7b;
            font-size: 22px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0,0,0,.2);
            transition: .3s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 40px rgba(255,255,255,.5);
        }

        .love {
            animation: loveAppear 2s ease forwards;
        }

        .love-heart {
            font-size: clamp(70px, 18vw, 140px);
            animation: heartbeat 1.2s infinite;
            margin-bottom: 5px;
        }

        .floating-heart {
            position: fixed;
            bottom: -60px;
            pointer-events: none;
            animation: fly linear forwards;
            z-index: 5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes loveAppear {
            0% { opacity: 0; transform: scale(.3); }
            60% { opacity: 1; transform: scale(1.12); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        @keyframes fly {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            15% { opacity: 1; }
            100% {
                transform: translateY(-115vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Первый экран -->
    <div class="screen" id="startScreen">
        <div class="subtitle">У меня для тебя кое-что есть...</div>
        <button onclick="showLove()">Нажми ❤️</button>
    </div>

    <!-- Второй экран -->
    <div class="screen hidden love" id="loveScreen">
        <div class="love-heart">❤️</div>
        <h1>Я тебя люблю</h1>
        <div class="subtitle">Ты — самое прекрасное, что есть в моей жизни 💕</div>
    </div>

    <script>
        function showLove() {
            document.getElementById("startScreen").classList.add("hidden");
            document.getElementById("loveScreen").classList.remove("hidden");

            // Создаём много сердечек
            for (let i = 0; i < 35; i++) {
                setTimeout(createHeart, i * 120);
            }
        }

        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "floating-heart";

            const hearts = ["❤️", "💗", "💕", "💖", "💓", "💞"];
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (20 + Math.random() * 35) + "px";
            heart.style.animationDuration = (4 + Math.random() * 5) + "s";

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 10000);
        }

        // После нажатия продолжаем создавать сердечки
        setInterval(() => {
            if (!document.getElementById("loveScreen").classList.contains("hidden")) {
                createHeart();
            }
        }, 350);
    </script>

</body>
</html>
